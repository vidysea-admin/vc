# nginx site for the Virtual Counsellor (golive-launcher; gate Q3: nginx proxy, client key from the proxy header).
# Install to /etc/nginx/sites-available/vc and symlink into sites-enabled. Replace vc.example.org with the real host.
#
# HTTP level (before this server block, e.g. /etc/nginx/conf.d/vc-limit.conf): see the limit_req_zone line in README step 7.
#
# TLS: run `sudo certbot --nginx -d vc.example.org` once the host resolves to this server. certbot adds the
# `listen 443 ssl` block and the certificate paths, and the HTTP -> HTTPS redirect, to this file.

server {
    listen 80;
    server_name vc.example.org;

    # The student UI: static files built into /opt/vc/apps/student (gate Q2).
    root /opt/vc/apps/student;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API. It binds 127.0.0.1:8080 (VC_API_PORT) and trusts ONLY X-Real-IP for the per-client rate limit, so each
    # proxy location below must SET the header from the socket peer, overwriting anything the client sent. Never pass a
    # client-supplied X-Real-IP or rely on X-Forwarded-For.
    #
    # Only the anonymous chat route is exposed. Everything else under /v1/ answers 404 at nginx and never reaches the API.
    # The per-IP request limit (zone vcchat) is declared at http level, see README step 7 (limit_req_zone).
    location = /v1/public/chat/turns {
        limit_req zone=vcchat burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 128k;
    }

    # Student chat (VC_CHAT_ENABLED=true only). Leave this block commented out while the flag is false. To open it,
    # uncomment it (the same proxy headers, so X-Real-IP is still SET from $remote_addr) and reload nginx.
    #
    # location ~ ^/v1/students/[^/]+/chat(/|$) {
    #     limit_req zone=vcchat burst=10 nodelay;
    #     limit_req_status 429;
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $remote_addr;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 120s;
    #     client_max_body_size 128k;
    # }

    # Every other API path (counsellor, export, erasure, admin, docs) is not public: 404 here.
    location /v1/ {
        return 404;
    }
}
