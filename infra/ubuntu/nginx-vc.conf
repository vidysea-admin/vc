# nginx site for the Virtual Counsellor (golive-launcher; gate Q3: nginx proxy, client key from the proxy header).
# Install to /etc/nginx/sites-available/vc and symlink into sites-enabled. Replace vc.example.org with the real host.
#
# HTTP level (before this server block, e.g. /etc/nginx/conf.d/vc-limit.conf): see the limit_req_zone line in README step 7.
#
# TLS: run `sudo certbot --nginx -d vc.example.org` once the host resolves to this server. certbot adds the
# `listen 443 ssl` block and the certificate paths, and the HTTP -> HTTPS redirect, to this file.

server {
    listen 80;
    server_name vc.example.org;

    # The student UI: static files built into /opt/vc/apps/student (gate Q2).
    root /opt/vc/apps/student;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API. It binds 127.0.0.1:8080 (VC_API_PORT) and trusts ONLY X-Real-IP for the per-client rate limit, so each
    # proxy location below must SET the header from the socket peer, overwriting anything the client sent. Never pass a
    # client-supplied X-Real-IP or rely on X-Forwarded-For.
    #
    # Only the anonymous chat route, the partner OpenAPI document and the partner/student chat routes below are exposed. Everything else under /v1/
    # answers 404 at nginx and never reaches the API.
    # The per-IP request limit (zone vcchat) is declared at http level, see README step 7 (limit_req_zone).
    location = /v1/public/chat/turns {
        limit_req zone=vcchat burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 128k;
    }

    # Partner server-to-server and browser surfaces (D-111, pc-partner-keys). Cross-origin access (CORS) is decided by the API per partner key and its
    # origin allowlist, so NO location below sets an Access-Control header, restricts methods (OPTIONS preflights must reach the API) or rewrites X-VC-Key /
    # Authorization (both pass through unchanged).
    #
    # The partner OpenAPI document (public, GET only; the API answers the method check).
    location = /v1/partner/openapi.json {
        limit_req zone=vcchat burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Anonymous widget voice (D-111, pc-voice V2): the visitor's page key (X-VC-Key) mints a single-use token (POST), then the browser opens the WebSocket
    # (the token travels as a subprotocol, never in the URL). The API checks the page key's allowed origins on both, so no location sets an Origin or CORS
    # header here. The stream gets the upgrade headers and a long read timeout; the session route takes an empty body only.
    location = /v1/public/voice/sessions {
        limit_req zone=vcchat burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 4k;
    }

    location = /v1/public/voice/stream {
        limit_req zone=vcchat burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # The voice WebSocket stream. It must come BEFORE the student chat regex below: nginx takes the FIRST matching regex location, and the chat regex
    # would otherwise swallow this path without the upgrade headers. The single-use token is the credential; it travels as a WebSocket subprotocol (or a bearer header), never in the query string, so it stays out of access logs.
    location ~ ^/v1/students/[^/]+/chat/threads/[^/]+/voice/stream$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Student chat for partners (a vck_ bearer plus the X-VC-Student-* headers, or a student JWT) and the voice session route. Opening this is the
    # D-111 rollout step: it also needs VC_CHAT_ENABLED=true and VC_PARTNER_KEY_PEPPER on the API host.
    location ~ ^/v1/students/[^/]+/chat(/|$) {
        limit_req zone=vcchat burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 128k;
    }

    # The embeddable widget (apps/widget/src/vc-widget.js, copied to /opt/vc/apps/widget/src/; same locations as apps/widget/nginx-widget.conf.snippet). The versioned file never changes once published, so it is cached
    # for a year; the unversioned alias follows the latest release, so it is cached for 5 minutes only.
    location = /widget/vc-widget.v1.js {
        alias /opt/vc/apps/widget/src/vc-widget.js;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /widget/vc-widget.js {
        alias /opt/vc/apps/widget/src/vc-widget.js;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The mic add-on (apps/widget/src/voice.js). vc-widget.js loads it only when the page sets data-vc-voice="on", from the same folder it was loaded from.
    # Versioned name only, immutable; bump the major together with vc-widget.js on a breaking change.
    location = /widget/vc-widget-voice.v1.js {
        alias /opt/vc/apps/widget/src/voice.js;
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Nothing else under /widget/ is published.
    location /widget/ {
        return 404;
    }

    # Every other API path (counsellor, export, erasure, admin, docs) is not public: 404 here.
    location /v1/ {
        return 404;
    }
}
