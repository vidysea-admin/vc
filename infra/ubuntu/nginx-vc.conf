# nginx site for the Virtual Counsellor (golive-launcher; gate Q3: nginx proxy, client key from the proxy header).
# Install to /etc/nginx/sites-available/vc and symlink into sites-enabled. Replace vc.example.org with the real host.
#
# TLS: run `sudo certbot --nginx -d vc.example.org` once the host resolves to this server. certbot adds the
# `listen 443 ssl` block and the certificate paths, and the HTTP -> HTTPS redirect, to this file.

server {
    listen 80;
    server_name vc.example.org;

    # The student UI: static files built into /opt/vc/apps/student (gate Q2).
    root /opt/vc/apps/student;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API. It binds 127.0.0.1:8080 (VC_API_PORT) and trusts ONLY X-Real-IP for the per-client rate limit, so this
    # line must SET the header from the socket peer, overwriting anything the client sent. Never pass a client-supplied
    # X-Real-IP or rely on X-Forwarded-For.
    location /v1/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 128k;
    }
}
